<text x="187.5" y="396.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">through 2 → 1 + 1 = 2</text>
<rect x="301.0" y="377.0" width="207.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="404.5" y="396.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">through 1 → 2 + 1 = 3</text>
<line x1="24.0" y1="421.0" x2="736.0" y2="421.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="441.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
