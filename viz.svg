<text x="56.0" y="446.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Diameter 3, found inside ONE height recursion — the classic 'piggyback a global best</text>
<text x="56.0" y="465.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">on a bottom-up pass' pattern. Calling height separately per node would be O(n²).</text>
<text x="72.0" y="500.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">answer</text>
